{% extends "base.html" %}{% block body %}<h1 class="mb-4">{{"تعديل" if obj else "إضافة"}} {{label}}</h1><form method="post" class="card shadow-sm p-4"><div class="row g-3">{% if kind!="facilities" %}<div class="col-md-6"><label class="form-label">المرفق</label><select name="facility_id" class="form-select" required>{% for f in facilities %}<option value="{{f.id}}" {% if obj and obj.facility_id==f.id %}selected{% endif %}>{{f.name}}</option>{% endfor %}</select></div>{% endif %}{% for c in cols %}{% if c=="expiry" %}<div class="col-md-6"><label class="form-label">{{c}}</label><input type="date" name="{{c}}" class="form-control" value="{{obj.expiry if obj and obj.expiry else ''}}"></div>{% else %}<div class="col-md-6"><label class="form-label">{{c}}</label><input name="{{c}}" class="form-control" value="{{getattr(obj,c,'') if obj else ''}}"></div>{% endif %}{% endfor %}</div><div class="mt-4 d-flex gap-2"><button class="btn btn-success">💾 حفظ</button><a class="btn btn-secondary" href="{{url_for('data_list',kind=kind)}}">إلغاء</a></div></form>{% endblock %}
