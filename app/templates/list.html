{% extends "base.html" %}{% block body %}<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3"><h1>{{label}}</h1><a class="btn btn-success" href="{{url_for('new',kind=kind)}}">➕ إضافة</a></div><form class="row g-2 mb-3"><div class="col"><input name="q" class="form-control" placeholder="بحث..." value="{{request.args.get('q','')}}"></div><div class="col-auto"><button class="btn btn-secondary">بحث</button></div></form><div class="table-responsive bg-white rounded shadow-sm"><table class="table table-hover align-middle mb-0"><thead><tr>{% for c in cols %}<th>{{c}}</th>{% endfor %}<th>إجراء</th></tr></thead><tbody>{% for r in rows %}<tr>{% for c in cols %}<td>{{getattr(r,c,"")}}</td>{% endfor %}<td>{% if kind=="facilities" %}<a class="btn btn-sm btn-primary" href="{{url_for('facility',fid=r.id)}}">📂 الملف</a>{% endif %}<a class="btn btn-sm btn-outline-primary" href="{{url_for('edit',kind=kind,rid=r.id)}}">✏️</a><form class="d-inline" method="post" action="{{url_for('delete',kind=kind,rid=r.id)}}" onsubmit="return confirm('حذف السجل؟')"><button class="btn btn-sm btn-outline-danger">حذف</button></form></td></tr>{% else %}<tr><td colspan="{{cols|length+1}}" class="text-center p-5 text-muted">لا توجد بيانات</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
